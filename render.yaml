services:
  - type: web
    name: pequod-ai-trade-ops
    runtime: static
    branch: codex/pequod-ai-deploy
    buildCommand: mkdir -p dist && cp index.html styles.css script.js dist/
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
