services:
  - type: web
    name: pequod-ai-trade-ops
    runtime: static
    branch: codex/pequod-ai-deploy
    buildCommand: mkdir -p dist/demo && cp index.html styles.css script.js dist/ && cp -R demo/llamaparse dist/demo/
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    domains:
      - pequodai.app
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
