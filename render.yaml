services:
  - type: web
    name: pequod-ai-trade-ops
    runtime: static
    branch: codex/pequod-ai-deploy
    buildCommand: mkdir -p dist/demo dist/assets && cp index.html styles.css script.js dist/ && cp -R demo/llamaparse dist/demo/ && cp -R assets/. dist/assets/
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    domains:
      - pequodai.app
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
  - type: web
    name: pequod-ai-parser-api
    runtime: node
    branch: codex/pequod-ai-deploy
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: LLAMA_CLOUD_API_KEY
        sync: false
