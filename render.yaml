services:
  - type: web
    name: pequod-ai-trade-ops
    runtime: node
    branch: codex/pequod-ai-deploy
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    domains:
      - pequodai.app
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
