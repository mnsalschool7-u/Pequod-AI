<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Log in to Pequod AI, the customs clearance, classification, and exception resolution platform."
    />
    <meta name="theme-color" content="#071624" />
    <title>Login | Pequod AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="login-page">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header" id="top">
      <div class="container nav-wrap">
        <a class="brand" href="/" aria-label="Pequod AI home">
          <span class="brand-mark" aria-hidden="true">
            <img src="../assets/pequod-logo-mark.png" alt="" />
          </span>
          <span><span class="brand-name">PEQUOD</span> <em>AI</em></span>
        </a>

        <nav class="desktop-nav" aria-label="Primary navigation">
          <a href="/#platform">Platform</a>
          <a href="/#how-it-works">How it works</a>
          <a href="/#technology">Technology</a>
          <a href="/login/" aria-current="page">Login</a>
        </nav>

        <button class="menu-button" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
          <span></span><span></span>
        </button>
      </div>
      <nav class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation" hidden>
        <a href="/#platform">Platform</a>
        <a href="/#how-it-works">How it works</a>
        <a href="/#technology">Technology</a>
        <a href="/login/" aria-current="page">Login</a>
      </nav>
    </header>

    <main id="main-content">
      <section class="login-section section-dark">
        <div class="hero-grid" aria-hidden="true"></div>
        <div class="hero-glow" aria-hidden="true"></div>
        <div class="container login-shell">
          <div class="login-copy reveal">
            <div class="eyebrow"><span></span> Pequod workspace</div>
            <h1>Login</h1>
            <p>Access for the Pequod customs exception workspace is coming soon.</p>
          </div>

          <div class="login-card reveal">
            <form id="login-form">
              <div class="form-field">
                <label for="login-email">Email</label>
                <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required />
              </div>
              <div class="form-field">
                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Password" required />
              </div>
              <button class="button button-primary submit-button" type="submit">Login</button>
              <p class="login-note">Accounts are not open yet. This page is ready for the authenticated workspace.</p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="../script.js"></script>
    <script>
      document.querySelector("#login-form").addEventListener("submit", (event) => {
        event.preventDefault();
      });
    </script>
  </body>
</html>
